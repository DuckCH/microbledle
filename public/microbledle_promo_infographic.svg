<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1350" width="1080" height="1350">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#070d18" />
      <stop offset="50%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Emerald Glow Filter -->
    <radialGradient id="glowTop" cx="25%" cy="15%" r="40%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </radialGradient>

    <!-- Cyan Glow Filter -->
    <radialGradient id="glowBottom" cx="80%" cy="65%" r="45%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- CTA Box Gradient -->
    <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f172a" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#083344" stop-opacity="0.8" />
    </linearGradient>

    <style>
      .font-sans { font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .font-thai { font-family: 'Prompt', 'Sukhumvit Set', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .font-mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1350" fill="url(#bgGrad)" />
  <circle cx="250" cy="180" r="450" fill="url(#glowTop)" />
  <circle cx="850" cy="800" r="500" fill="url(#glowBottom)" />

  <!-- HEADER BADGE -->
  <g transform="translate(540, 65)">
    <rect x="-170" y="-18" width="340" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1.5" />
    <text x="0" y="5" text-anchor="middle" fill="#6ee7b7" class="font-sans" font-size="14" font-weight="800" letter-spacing="1.5">⚡ THE DAILY MEDICAL GAME</text>
  </g>

  <!-- MAIN TITLE: MICROBLEDLE -->
  <g transform="translate(540, 150)">
    <!-- Microscope Icon -->
    <text x="-250" y="5" font-size="52" text-anchor="middle">🔬</text>
    <text x="30" y="10" text-anchor="middle" fill="#ffffff" class="font-sans" font-size="68" font-weight="900" letter-spacing="-1">MICROBLEDLE</text>
  </g>

  <!-- SUBTITLE TAGLINE -->
  <text x="540" y="205" text-anchor="middle" fill="#34d399" class="font-thai" font-size="26" font-weight="700">
    เกมทายเชื้อจุลชีพทางคลินิก &amp; ชาเลนจ์ยาฆ่าเชื้อ ATB ประจำวัน
  </text>
  <text x="540" y="232" text-anchor="middle" fill="#94a3b8" class="font-sans" font-size="16" font-weight="600">
    Daily Clinical Microbiology &amp; Empiric Antibiotic Challenge for Doctors &amp; Med Students
  </text>

  <!-- WORDLE TILES ROW -->
  <g transform="translate(540, 275)">
    <!-- Tile 1: Gram (+) -->
    <rect x="-295" y="-18" width="90" height="36" rx="8" fill="#10b981" />
    <text x="-250" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">GRAM</text>

    <!-- Tile 2: Morphology -->
    <rect x="-195" y="-18" width="90" height="36" rx="8" fill="#10b981" />
    <text x="-150" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">SHAPE</text>

    <!-- Tile 3: Oxygen -->
    <rect x="-95" y="-18" width="90" height="36" rx="8" fill="#f59e0b" />
    <text x="-50" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">O₂ TEST</text>

    <!-- Tile 4: Catalase -->
    <rect x="5" y="-18" width="90" height="36" rx="8" fill="#334155" />
    <text x="50" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">CATALASE</text>

    <!-- Tile 5: Oxidase -->
    <rect x="105" y="-18" width="90" height="36" rx="8" fill="#10b981" />
    <text x="150" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">OXIDASE</text>

    <!-- Tile 6: Lactose -->
    <rect x="205" y="-18" width="90" height="36" rx="8" fill="#10b981" />
    <text x="250" y="4" text-anchor="middle" fill="#ffffff" class="font-mono" font-size="12" font-weight="800">LACTOSE</text>
  </g>

  <!-- ==================== 4 FEATURE CARDS ==================== -->

  <!-- CARD 1: DAILY CLINICAL CASE -->
  <g transform="translate(60, 320)">
    <rect width="460" height="210" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="52" height="52" rx="16" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-width="1" />
    <text x="46" y="55" font-size="28" text-anchor="middle">🩺</text>
    <!-- Titles -->
    <text x="85" y="42" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">1. Daily Clinical Case</text>
    <text x="85" y="64" fill="#34d399" class="font-thai" font-size="15" font-weight="700">เคสผู้ป่วยจริงรายวัน</text>
    <!-- Description -->
    <text x="20" y="108" fill="#cbd5e1" class="font-thai" font-size="15" font-weight="400">
      <tspan x="20" dy="0">โจทย์ระบุเฉพาะ อายุ, เพศ และ Chief Complaint ชัดเจน</tspan>
      <tspan x="20" dy="24" fill="#94a3b8" class="font-sans" font-size="13">Ex: "A 24-year-old female presents with acute</tspan>
      <tspan x="20" dy="20" fill="#94a3b8" class="font-sans" font-size="13">dysuria, frequency, and suprapubic pain."</tspan>
    </text>
  </g>

  <!-- CARD 2: 6 TRIES TO GUESS -->
  <g transform="translate(560, 320)">
    <rect width="460" height="210" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="52" height="52" rx="16" fill="#06b6d4" fill-opacity="0.15" stroke="#06b6d4" stroke-width="1" />
    <text x="46" y="55" font-size="28" text-anchor="middle">🔬</text>
    <!-- Titles -->
    <text x="85" y="42" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">2. 6 Tries Diagnosis</text>
    <text x="85" y="64" fill="#22d3ee" class="font-thai" font-size="15" font-weight="700">ทายเชื้อก่อโรคใน 6 ครั้ง</text>
    <!-- Description -->
    <text x="20" y="108" fill="#cbd5e1" class="font-thai" font-size="15" font-weight="400">
      <tspan x="20" dy="0">วิเคราะห์ผลผ่านตารางเฉลยสี เขียว / เหลือง / เทา</tspan>
      <tspan x="20" dy="24">เทียบ Gram stain, Morphology, Catalase, Oxidase,</tspan>
      <tspan x="20" dy="24">Lactose fermentation เพื่อตัดช้อยส์วินิจฉัย</tspan>
    </text>
  </g>

  <!-- CARD 3: ANTIBIOTIC CHALLENGE -->
  <g transform="translate(60, 555)">
    <rect width="460" height="210" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="52" height="52" rx="16" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1" />
    <text x="46" y="55" font-size="28" text-anchor="middle">💊</text>
    <!-- Titles -->
    <text x="85" y="42" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">3. Antibiotic Challenge</text>
    <text x="85" y="64" fill="#fbbf24" class="font-thai" font-size="15" font-weight="700">ท้าดวลสั่งยาฆ่าเชื้อ Empiric Rx</text>
    <!-- Description -->
    <text x="20" y="108" fill="#cbd5e1" class="font-thai" font-size="15" font-weight="400">
      <tspan x="20" dy="0">เมื่อทายเชื้อถูกแล้ว เลือกรักษาต่อด้วยยาฆ่าเชื้อ</tspan>
      <tspan x="20" dy="24">ที่ตรงตาม Guideline มาตรฐานการรักษา</tspan>
      <tspan x="20" dy="24" fill="#fbbf24" font-weight="600">ตอบถูกรับโบนัสพิเศษ +50 EXP ทันที!</tspan>
    </text>
  </g>

  <!-- CARD 4: MICRODEX 70 PATHOGENS -->
  <g transform="translate(560, 555)">
    <rect width="460" height="210" rx="24" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <!-- Icon Container -->
    <rect x="20" y="20" width="52" height="52" rx="16" fill="#8b5cf6" fill-opacity="0.15" stroke="#8b5cf6" stroke-width="1" />
    <text x="46" y="55" font-size="28" text-anchor="middle">📖</text>
    <!-- Titles -->
    <text x="85" y="42" fill="#ffffff" class="font-sans" font-size="20" font-weight="800">4. Microdex (70 Bugs)</text>
    <text x="85" y="64" fill="#c084fc" class="font-thai" font-size="15" font-weight="700">คลัง 70 เชื้อพร้อม Study Mode</text>
    <!-- Description -->
    <text x="20" y="108" fill="#cbd5e1" class="font-thai" font-size="15" font-weight="400">
      <tspan x="20" dy="0">รวบรวม 70 แบคทีเรีย, ไวรัส และราทางการแพทย์</tspan>
      <tspan x="20" dy="24">พร้อม High-Yield Keywords, Key Clues และ Treatment</tspan>
      <tspan x="20" dy="24" fill="#a855f7" font-weight="600">เปิดโหมด Study Mode ทบทวนสอบได้ทันที</tspan>
    </text>
  </g>

  <!-- ==================== MEDICAL RANK PROGRESSION STRIP ==================== -->
  <g transform="translate(60, 790)">
    <rect width="960" height="115" rx="24" fill="#0f172a" stroke="#f59e0b" stroke-opacity="0.3" stroke-width="1.5" />
    
    <!-- Title -->
    <text x="25" y="34" fill="#fbbf24" class="font-sans" font-size="16" font-weight="800">🏆 17-LEVEL MEDICAL HIERARCHY SYSTEM</text>
    <text x="25" y="56" fill="#94a3b8" class="font-thai" font-size="14">
      สะสม EXP จากเคสประจำวันและชาเลนจ์ยาฆ่าเชื้อ ไต่อันดับยศแพทย์สู่จุดสูงสุดของประเทศ!
    </text>

    <!-- Rank Progression Pills -->
    <!-- Extern -->
    <g transform="translate(25, 70)">
      <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="20" fill="#ffffff" class="font-sans" font-size="12" font-weight="700">🩺 Extern</text>
      <text x="135" y="20" text-anchor="end" fill="#64748b" class="font-mono" font-size="11" font-weight="800">Lvl 6</text>
    </g>
    <text x="180" y="90" fill="#64748b" class="font-sans" font-size="16" font-weight="700">→</text>

    <!-- Intern -->
    <g transform="translate(205, 70)">
      <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="20" fill="#ffffff" class="font-sans" font-size="12" font-weight="700">🥼 Intern</text>
      <text x="135" y="20" text-anchor="end" fill="#64748b" class="font-mono" font-size="11" font-weight="800">Lvl 7</text>
    </g>
    <text x="360" y="90" fill="#64748b" class="font-sans" font-size="16" font-weight="700">→</text>

    <!-- Resident -->
    <g transform="translate(385, 70)">
      <rect width="145" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="20" fill="#ffffff" class="font-sans" font-size="12" font-weight="700">💉 Resident</text>
      <text x="135" y="20" text-anchor="end" fill="#64748b" class="font-mono" font-size="11" font-weight="800">Lvl 9</text>
    </g>
    <text x="540" y="90" fill="#64748b" class="font-sans" font-size="16" font-weight="700">→</text>

    <!-- Chief Resident -->
    <g transform="translate(565, 70)">
      <rect width="165" height="30" rx="8" fill="#1e293b" stroke="#334155" />
      <text x="12" y="20" fill="#ffffff" class="font-sans" font-size="12" font-weight="700">🏆 Chief Resident</text>
      <text x="155" y="20" text-anchor="end" fill="#64748b" class="font-mono" font-size="11" font-weight="800">Lvl 12</text>
    </g>
    <text x="740" y="90" fill="#64748b" class="font-sans" font-size="16" font-weight="700">→</text>

    <!-- Senior Staff -->
    <g transform="translate(765, 70)">
      <rect width="170" height="30" rx="8" fill="#2d1f05" stroke="#fbbf24" stroke-width="1.5" />
      <text x="12" y="20" fill="#fbbf24" class="font-sans" font-size="12" font-weight="800">👑 Senior Staff</text>
      <text x="160" y="20" text-anchor="end" fill="#fbbf24" class="font-mono" font-size="11" font-weight="800">Lvl 17</text>
    </g>
  </g>

  <!-- ==================== BOTTOM CALL-TO-ACTION & QR BOX ==================== -->
  <g transform="translate(60, 930)">
    <rect width="960" height="245" rx="28" fill="url(#ctaGrad)" stroke="#10b981" stroke-width="2" />
    
    <!-- Left Copy -->
    <text x="40" y="55" fill="#ffffff" class="font-sans" font-size="32" font-weight="900">
      Ready for Today's Clinical Case?
    </text>
    <text x="40" y="95" fill="#34d399" class="font-thai" font-size="22" font-weight="700">
      สแกน QR Code หรือเข้าเว็บเพื่อเริ่มเล่นได้ทันที (ไม่ต้องดาวน์โหลด)
    </text>
    <text x="40" y="152" fill="#ffffff" class="font-mono" font-size="36" font-weight="800" letter-spacing="1">
      MICROBLEDLE.COM
    </text>
    <text x="40" y="195" fill="#94a3b8" class="font-thai" font-size="16" font-weight="500">
      ✓ เล่นฟรี 100%   ✓ ซิงก์คะแนนบน Cloud   ✓ แข่งขัน Leaderboard กับเพื่อนแพทย์
    </text>

    <!-- QR Code Box on the Right -->
    <g transform="translate(725, 25)">
      <rect width="195" height="195" rx="18" fill="#ffffff" stroke="#10b981" stroke-width="3" />
      
      <!-- Generated SVG QR Code Pattern representing https://microbledle.com -->
      <g transform="translate(18, 18)">
        <!-- Corner Finder 1 (Top-Left) -->
        <rect x="0" y="0" width="48" height="48" fill="#070b14" rx="4" />
        <rect x="8" y="8" width="32" height="32" fill="#ffffff" rx="2" />
        <rect x="16" y="16" width="16" height="16" fill="#070b14" rx="1" />

        <!-- Corner Finder 2 (Top-Right) -->
        <rect x="112" y="0" width="48" height="48" fill="#070b14" rx="4" />
        <rect x="120" y="8" width="32" height="32" fill="#ffffff" rx="2" />
        <rect x="128" y="16" width="16" height="16" fill="#070b14" rx="1" />

        <!-- Corner Finder 3 (Bottom-Left) -->
        <rect x="0" y="112" width="48" height="48" fill="#070b14" rx="4" />
        <rect x="8" y="120" width="32" height="32" fill="#ffffff" rx="2" />
        <rect x="16" y="128" width="16" height="16" fill="#070b14" rx="1" />

        <!-- Synthetic QR Data Grid -->
        <rect x="56" y="8" width="8" height="24" fill="#070b14" />
        <rect x="72" y="16" width="16" height="8" fill="#070b14" />
        <rect x="96" y="8" width="8" height="32" fill="#070b14" />
        <rect x="8" y="56" width="24" height="8" fill="#070b14" />
        <rect x="16" y="72" width="8" height="24" fill="#070b14" />
        <rect x="32" y="88" width="16" height="16" fill="#070b14" />
        <rect x="56" y="56" width="16" height="16" fill="#10b981" />
        <rect x="80" y="56" width="24" height="8" fill="#070b14" />
        <rect x="72" y="72" width="16" height="16" fill="#070b14" />
        <rect x="96" y="72" width="8" height="16" fill="#070b14" />
        <rect x="56" y="88" width="8" height="24" fill="#070b14" />
        <rect x="80" y="96" width="24" height="8" fill="#070b14" />
        <rect x="112" y="56" width="16" height="8" fill="#070b14" />
        <rect x="120" y="72" width="32" height="8" fill="#070b14" />
        <rect x="136" y="88" width="16" height="16" fill="#070b14" />
        <rect x="56" y="120" width="24" height="8" fill="#070b14" />
        <rect x="72" y="136" width="16" height="16" fill="#070b14" />
        <rect x="96" y="120" width="8" height="32" fill="#070b14" />
        <rect x="112" y="120" width="16" height="8" fill="#070b14" />
        <rect x="128" y="136" width="24" height="16" fill="#070b14" />
      </g>
      <text x="97" y="180" text-anchor="middle" fill="#065f46" class="font-sans" font-size="9" font-weight="800">SCAN TO PLAY</text>
    </g>
  </g>

  <!-- FOOTER WATERMARK -->
  <text x="540" y="1225" text-anchor="middle" fill="#64748b" class="font-sans" font-size="16" font-weight="600" letter-spacing="1">
    MICROBLEDLE.COM • 100% FREE • NO DOWNLOAD REQUIRED • PLAY ON ANY BROWSER
  </text>
</svg>